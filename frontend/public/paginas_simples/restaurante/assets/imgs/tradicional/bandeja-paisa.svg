<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="500" height="300">
  <!-- Plato base -->
  <ellipse cx="250" cy="200" rx="200" ry="80" fill="#f5f5f5" stroke="#ccc" stroke-width="2"/>
  
  <!-- Arroz -->
  <ellipse cx="180" cy="180" rx="70" ry="40" fill="#fff" stroke="#ddd" stroke-width="1"/>
  
  <!-- Frijoles -->
  <ellipse cx="300" cy="170" rx="60" ry="35" fill="#8B4513" stroke="#6B3E0B" stroke-width="1"/>
  
  <!-- Carne molida sobre frijoles -->
  <path d="M270,155 Q300,145 330,155 Q310,175 270,155" fill="#5D4037"/>
  
  <!-- Chicharrón -->
  <path d="M230,140 Q250,130 270,140 Q260,155 230,140" fill="#D2B48C" stroke="#A0522D" stroke-width="1"/>
  
  <!-- Huevo frito -->
  <circle cx="350" cy="150" r="25" fill="#FFF59D" stroke="#FBC02D" stroke-width="1"/>
  <circle cx="350" cy="150" r="15" fill="#FFA000"/>
  
  <!-- Aguacate -->
  <path d="M150,140 Q170,120 190,140 Q170,160 150,140" fill="#AED581" stroke="#7CB342" stroke-width="1"/>
  
  <!-- Plátano maduro -->
  <path d="M120,160 Q140,150 160,160 Q140,170 120,160" fill="#FFB74D" stroke="#FB8C00" stroke-width="1"/>
  
  <!-- Chorizo -->
  <rect x="200" y="130" width="40" height="15" rx="7" ry="7" fill="#D84315" stroke="#BF360C" stroke-width="1"/>
  
  <!-- Arepa -->
  <ellipse cx="250" cy="160" rx="25" ry="10" fill="#FFF9C4" stroke="#FFF176" stroke-width="1"/>
  
  <!-- Título -->
  <text x="250" y="50" font-family="Arial" font-size="24" text-anchor="middle" fill="#333">Bandeja Paisa</text>
  <text x="250" y="80" font-family="Arial" font-size="16" text-anchor="middle" fill="#666">Plato tradicional colombiano</text>
</svg>