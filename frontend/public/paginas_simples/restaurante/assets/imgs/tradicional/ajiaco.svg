<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="500" height="300">
  <!-- Plato/Tazón -->
  <ellipse cx="250" cy="200" rx="150" ry="60" fill="#f5f5f5" stroke="#ccc" stroke-width="2"/>
  
  <!-- Sopa -->
  <ellipse cx="250" cy="190" rx="130" ry="50" fill="#E6C78F" stroke="#D4B67F" stroke-width="1"/>
  
  <!-- Papas -->
  <circle cx="200" cy="180" r="15" fill="#FFF9C4" stroke="#FFF176" stroke-width="1"/>
  <circle cx="240" cy="170" r="18" fill="#FFF9C4" stroke="#FFF176" stroke-width="1"/>
  <circle cx="280" cy="185" r="12" fill="#FFF9C4" stroke="#FFF176" stroke-width="1"/>
  
  <!-- Pollo desmenuzado -->
  <path d="M220,160 Q240,150 260,160 Q240,170 220,160" fill="#FFECB3" stroke="#FFE082" stroke-width="1"/>
  
  <!-- Mazorca -->
  <ellipse cx="310" cy="165" rx="25" ry="10" fill="#FFF176" stroke="#FFEE58" stroke-width="1"/>
  <line x1="285" y1="165" x2="335" y2="165" stroke="#FFEE58" stroke-width="1"/>
  <line x1="290" y1="160" x2="330" y2="160" stroke="#FFEE58" stroke-width="1"/>
  <line x1="290" y1="170" x2="330" y2="170" stroke="#FFEE58" stroke-width="1"/>
  
  <!-- Guascas (hierbas) -->
  <path d="M180,150 L185,130 M190,150 L195,135 M200,150 L205,130" stroke="#7CB342" stroke-width="1"/>
  <path d="M270,150 L275,130 M280,150 L285,135 M290,150 L295,130" stroke="#7CB342" stroke-width="1"/>
  
  <!-- Crema -->
  <path d="M230,140 Q250,130 270,140" stroke="#FFFFFF" stroke-width="3" fill="none"/>
  
  <!-- Alcaparras -->
  <circle cx="210" cy="150" r="3" fill="#33691E"/>
  <circle cx="220" cy="145" r="3" fill="#33691E"/>
  <circle cx="230" cy="155" r="3" fill="#33691E"/>
  
  <!-- Aguacate -->
  <path d="M320,140 Q330,130 340,140 Q330,150 320,140" fill="#AED581" stroke="#7CB342" stroke-width="1"/>
  
  <!-- Título -->
  <text x="250" y="50" font-family="Arial" font-size="24" text-anchor="middle" fill="#333">Ajiaco Santafereño</text>
  <text x="250" y="80" font-family="Arial" font-size="16" text-anchor="middle" fill="#666">Sopa tradicional colombiana</text>
</svg>