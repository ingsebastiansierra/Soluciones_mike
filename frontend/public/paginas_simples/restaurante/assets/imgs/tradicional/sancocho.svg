<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="500" height="300">
  <!-- Plato/Tazón -->
  <ellipse cx="250" cy="200" rx="150" ry="60" fill="#f5f5f5" stroke="#ccc" stroke-width="2"/>
  
  <!-- Caldo -->
  <ellipse cx="250" cy="190" rx="130" ry="50" fill="#F9A825" stroke="#F57F17" stroke-width="1" opacity="0.8"/>
  
  <!-- Yuca -->
  <path d="M180,160 L200,170 L220,160 L200,180 Z" fill="#FFFDE7" stroke="#FFF9C4" stroke-width="1"/>
  
  <!-- Plátano -->
  <path d="M230,160 Q250,150 270,160 Q250,170 230,160" fill="#FFD54F" stroke="#FFC107" stroke-width="1"/>
  
  <!-- Papa -->
  <circle cx="290" cy="170" r="15" fill="#FFF9C4" stroke="#FFF176" stroke-width="1"/>
  
  <!-- Mazorca -->
  <ellipse cx="320" cy="180" rx="20" ry="8" fill="#FFF176" stroke="#FFEE58" stroke-width="1"/>
  <line x1="300" y1="180" x2="340" y2="180" stroke="#FFEE58" stroke-width="1"/>
  <line x1="305" y1="175" x2="335" y2="175" stroke="#FFEE58" stroke-width="1"/>
  <line x1="305" y1="185" x2="335" y2="185" stroke="#FFEE58" stroke-width="1"/>
  
  <!-- Pollo/Carne -->
  <path d="M200,140 L220,150 L240,140 L220,160 Z" fill="#A1887F" stroke="#8D6E63" stroke-width="1"/>
  
  <!-- Cilantro/Hierbas -->
  <path d="M180,140 L185,120 M190,140 L195,125 M200,140 L205,120" stroke="#388E3C" stroke-width="1"/>
  <path d="M260,140 L265,120 M270,140 L275,125 M280,140 L285,120" stroke="#388E3C" stroke-width="1"/>
  
  <!-- Zanahoria -->
  <path d="M250,170 L260,150 L270,170" fill="#FF7043" stroke="#E64A19" stroke-width="1"/>
  
  <!-- Título -->
  <text x="250" y="50" font-family="Arial" font-size="24" text-anchor="middle" fill="#333">Sancocho de Gallina</text>
  <text x="250" y="80" font-family="Arial" font-size="16" text-anchor="middle" fill="#666">Sopa tradicional colombiana</text>
</svg>